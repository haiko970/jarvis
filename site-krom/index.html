:root{
  --ink:#1c1a1f;--cream:#f0e8e0;--dark:#191a1e;--flav:#ab9ac4;--rv:transparent;
  --ease:cubic-bezier(.22,.8,.24,1);
  --u:min(calc(100vw / 1440),calc(100vh / 900));
  --w:calc(100vw / 1440);
  --n:min(calc(100vw / 1440),1px);
  --ka:.405;--pu:.7px;--sheet:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.disp{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-.01em;line-height:.92}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.spr{background-image:var(--sheet);background-repeat:no-repeat}
#gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:2;pointer-events:none;display:block}

/* ---------- barre du haut ---------- */
.nav{position:fixed;top:-120px;left:0;right:0;z-index:50;height:calc(94*var(--n));padding:0 calc(37*var(--n)) 0 calc(42*var(--n));display:flex;align-items:center;justify-content:space-between;color:var(--ink);transition:top .9s cubic-bezier(.22,.9,.24,1),color .3s}
body.in .nav{top:0}
.brand{display:flex;align-items:center;gap:calc(10*var(--n));font-weight:800;font-size:calc(15.5*var(--n));letter-spacing:.06em}
.mark{width:calc(36*var(--n));height:calc(36*var(--n));border-radius:50%;background:var(--ink);display:grid;place-items:center;transition:background .3s}
.mark svg{width:58%;height:58%;fill:var(--cream);transition:fill .3s}
.pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;padding:calc(5*var(--n));border:1.5px solid #fff;border-radius:99px;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .3s,background .3s}
.pill.light{border-color:rgba(28,26,31,.14);background:rgba(255,255,255,.35)}
.pill a{position:relative;z-index:1;padding:calc(9*var(--n)) calc(18*var(--n));font-size:calc(14.5*var(--n));font-weight:500;border-radius:99px;color:var(--ink);white-space:nowrap}
.pill a.on{font-weight:600}
.pill .hl{position:absolute;top:calc(5*var(--n));bottom:calc(5*var(--n));left:0;width:0;border-radius:99px;background:#fff;transition:left .5s var(--ease),width .5s var(--ease)}
.nav-r{display:flex;align-items:center;gap:calc(8*var(--n))}
.chip{height:calc(37*var(--n));padding:0 calc(14*var(--n));border:1.5px solid currentColor;border-radius:99px;font-size:calc(13*var(--n));font-weight:600;display:flex;align-items:center}
#basket{position:relative;width:calc(44*var(--n));height:calc(37*var(--n));padding:0;justify-content:center}
#basket svg{width:calc(18*var(--n));height:calc(18*var(--n));stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ink);color:#fff;font:500 10.5px "DM Mono",monospace;display:grid;place-items:center;transform:scale(0)}
#badge.has{transform:scale(1)}
.dibs{height:calc(37*var(--n));padding:0 calc(18*var(--n));border-radius:99px;background:var(--ink);color:var(--cream);font-size:calc(14.5*var(--n));font-weight:600;transition:background .3s,color .3s}
.nav.dark{color:var(--cream)}
.nav.dark .mark{background:var(--cream)}.nav.dark .mark svg{fill:var(--ink)}
.nav.dark .dibs{background:#8fa8a3;color:var(--ink)}
.nav.dark #badge{background:var(--cream);color:var(--ink)}
.nav.dark .pill{border-color:rgba(240,232,224,.5)}
.nav.dark .pill a{color:var(--cream)}.nav.dark .pill a.on{color:var(--ink)}

/* ---------- 1. héros ---------- */
.hero{position:relative;height:100svh;min-height:300px;overflow:hidden;background:var(--flav)}
.reveal{position:absolute;inset:0;background:var(--rv)}
.rings{position:absolute;left:50%;top:41%;width:calc(2200*var(--u));height:calc(2200*var(--u));margin:calc(-1100*var(--u)) 0 0 calc(-1100*var(--u));background:repeating-radial-gradient(circle,rgba(255,255,255,.13) 0,rgba(255,255,255,.02) calc(40*var(--u)),rgba(255,255,255,.13) calc(80*var(--u)));-webkit-mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);opacity:0;transform:scale(.85);transition:opacity 1.1s ease-out,transform 1.1s ease-out}
body.in .rings{opacity:1;transform:none}
.bits{position:absolute;inset:0;pointer-events:none}
.bit{position:absolute;filter:blur(1.5px);opacity:0;border-radius:50%}
.arc{position:absolute;inset:0;touch-action:pan-y;cursor:grab}
#title{position:absolute;z-index:60;left:0;right:0;top:calc(50% + 265*var(--u));text-align:center;font-size:calc(96*var(--u));color:var(--ink);pointer-events:none;white-space:nowrap}
#title .tl{display:block}
#title .tl.old{position:absolute;left:0;right:0;top:0}
#title .w{display:inline-block;white-space:nowrap}
#title .l{display:inline-block}
#count{position:absolute;z-index:1;top:calc(50% + 215*var(--u));right:calc(50% - 692*var(--u));font-size:calc(200*var(--u));color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);pointer-events:none}
#play{position:absolute;z-index:60;left:50%;top:calc(50% + 200*var(--u));width:calc(52*var(--u));height:calc(52*var(--u));margin:calc(-26*var(--u)) 0 0 calc(-26*var(--u));border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(40,28,60,.12);display:grid;place-items:center;transition:transform .25s var(--ease),opacity .6s}
#play svg{width:calc(18*var(--u));height:calc(18*var(--u));stroke:var(--ink);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
#play:hover{transform:scale(1.08)}#play:hover svg{transform:translateX(2px)}#play:active{transform:scale(.94)}
#auto{position:absolute;z-index:60;right:calc(50% - 680*var(--u));top:calc(50% + 170*var(--u));display:flex;align-items:center;gap:9px;color:#fff;font:500 11px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
#auto i{width:26px;height:26px;border:1.3px solid #fff;border-radius:50%;display:grid;place-items:center}
#auto svg{width:10px;height:10px;fill:#fff}
#auto .pl{display:none}#auto[aria-pressed=false] .pl{display:block}#auto[aria-pressed=false] .pa{display:none}
#play,#count,#auto{opacity:0}
body.in #play{opacity:1;transition:opacity .6s .5s,transform .25s var(--ease)}
body.in #count{opacity:1;transition:opacity .6s .62s}
body.in #auto{opacity:1;transition:opacity .6s .74s}

/* ---------- 2. dedans ---------- */
#inside{position:relative;height:500vh;background:var(--flav)}
.pin{position:sticky;top:0;height:100svh;overflow:hidden}
.in-dark{position:absolute;inset:0;background:#120d16;opacity:0}
.frame{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform:translate(-50%,-50%);transform-origin:50% 50%}
.in-num{position:absolute;left:510px;top:240px;width:640px;text-align:center;font-size:428px;color:transparent;-webkit-text-stroke:1.6px #fff}
#inBar{position:absolute;left:665px;top:110px;width:330px;height:694px}
#inFront{position:fixed;left:0;top:0;width:100vw;height:100svh;z-index:3;pointer-events:none;visibility:hidden;overflow:hidden}
.in-head{position:absolute;left:40px;top:300px;font-size:88px;line-height:.93;color:var(--cream)}
.in-head small{font-size:.72em}
.in-icons{position:absolute;left:1292px;top:310px;display:grid;gap:4px;pointer-events:auto}
.in-icons button{width:66px;height:66px;border:1.5px solid #fff;border-radius:50%;display:grid;place-items:center;transition:background .3s}
.in-icons svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.in-icons button.on{background:var(--cream);border-color:var(--cream)}.in-icons button.on svg{stroke:var(--ink)}
.in-cap{position:absolute;right:42px;top:596px;text-align:right;font:400 14px/1.5 "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.92)}
.storm{position:absolute;inset:0}
.storm i{position:absolute;left:0;top:0;visibility:hidden;will-change:transform,opacity}

/* ---------- 3. boutique ---------- */
#shop{position:relative;background:var(--cream);padding:calc(96*var(--w)) calc(39*var(--w)) calc(80*var(--w))}
.lines span{display:block;overflow:hidden;padding-bottom:.06em}
.lines span b{display:block;font-weight:400;transform:translateY(105%);transition:transform 1s var(--ease)}
.lines span:nth-child(2) b{transition-delay:.08s}.lines span:nth-child(3) b{transition-delay:.16s}
.lines.on span b{transform:none}
#shop h2{font-size:calc(94*var(--w));line-height:.86}
.shop-cap{position:absolute;left:calc(1128*var(--w));top:calc(132*var(--w));font:400 calc(15.5*var(--w))/1.42 "DM Mono",monospace;opacity:0;translate:0 24px;transition:opacity 1s,translate 1s var(--ease)}

function tamaTex(m,i){
  const W=1024,H=512,[c,x]=cv2d(W,H);

  // dos : la fiche technique

  x.fillStyle='rgba(255,255,255,.92)'; x.beginPath(); x.roundRect(px-pw/2,py,pw,ph,16); x.fill();

    x.textAlign='left'; x.fillText(s[0],px-pw/2+20,y); x.textAlign='right'; x.fillText(s[1],px+pw/2-20,y);
    x.globalAlpha=.25; x.fillRect(px-pw/2+20,y+13,pw-40,1); x.globalAlpha=1; });
  x.textAlign='center'; x.fillStyle=m.stripe; x.font='500 19px "DM Mono"'; x.fillText('TOURNÉ, PAS MOULÉ',px,H*.845);
  x.font='500 17px "DM Mono"'; x.fillText('N° 0'+(i+1)+' / 05',px,H*.13);

}

const shadowGeo=new THREE.PlaneGeometry(1.25*BW,1.04*BH);

/* --- un kendama --- */
class Bar{
  constructor(){
    const pm=o=>new THREE.MeshPhysicalMaterial(Object.assign({transparent:true,metalness:0,envMapIntensity:.42},o));
    this.ken=pm({roughness:.55,clearcoat:.3,clearcoatRoughness:.4,side:THREE.DoubleSide});
    this.tamaM=pm({roughness:.45,clearcoat:.5,clearcoatRoughness:.32});
    this.strM=pm({roughness:.9});
    this.group=new THREE.Group(); this.group.rotation.order='ZYX';
    const inner=new THREE.Group(); inner.position.copy(CEN).multiplyScalar(-1); this.group.add(inner);
    const add=(g,mat,f)=>{ const me=new THREE.Mesh(g,mat); f&&f(me); inner.add(me); return me; };
    this.kenParts=[
      add(G.handle,this.ken),
      add(G.cup,this.ken,o=>{o.rotation.x=Math.PI}),                                   // coupelle du bas
      add(G.sarado,this.ken,o=>{o.rotation.z=Math.PI/2;o.position.set(0,12,0)}),
      add(G.cup,this.ken,o=>{o.rotation.z=Math.PI/2;o.position.set(-3.1,12,0)}),        // grande coupelle
      add(G.cup,this.ken,o=>{o.rotation.z=-Math.PI/2;o.position.set(3.1,12,0);o.scale.setScalar(.87)}),
      add(G.spike,this.ken),
      add(G.string,this.strM),
      add(G.bead,this.strM,o=>o.position.copy(SPTS[SPTS.length-1])),
    ];
    this.kenParts[1].position.y=0.35;
    this.tama=add(G.tama,this.tamaM,o=>o.position.copy(TC));
    this.group.traverse(o=>o.userData.bar=this);
    this.shadowM=new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false});
    this.shadow=new THREE.Mesh(shadowGeo,this.shadowM); this.shadow.renderOrder=-1;
    this.model=-1; this.k=0;
  }
  setModel(i){ if(i===this.model)return; this.model=i; this.ken.map=TEX[i].wood; this.tamaM.map=TEX[i].tama; this.strM.color.set(M[i].str); this.ken.needsUpdate=this.tamaM.needsUpdate=true; }
  setOp(o){ this.ken.opacity=this.tamaM.opacity=this.strM.opacity=o; }
}

/* ============ planche d'images (fabriquée à partir du modèle 3D) ============ */
let SW=1,SH=1; const KB=[], BB=[];
function spr(el,b,pad=0){
  const x=b[0]-pad,y=b[1]-pad,w=b[2]+2*pad,h=b[3]+2*pad;
  el.style.backgroundSize=`${SW/w*100}% ${SH/h*100}%`;
  el.style.backgroundPosition=`${x/(SW-w)*100}% ${y/(SH-h)*100}%`;
}
async function buildSheet(){
  const kh=820, kw=Math.round(kh*KA), gap=36, bs=260;
  SW=gap+5*(kw+gap); SH=gap+kh+gap+bs+gap;
  const [c,x]=cv2d(SW,SH);
  for(let i=0;i<5;i++){ KB[i]=[gap+i*(kw+gap),gap,kw,kh]; BB[i]=[gap+i*(kw+gap)+(kw-bs)/2,gap+kh+gap,bs,bs]; }
  if(GL){
    const b=new Bar(); scene.add(b.group);
    const oc=new THREE.OrthographicCamera(-BW/2,BW/2,BH/2,-BH/2,1,400); oc.position.set(0,0,200);
    renderer.setPixelRatio(1); renderer.setSize(kw,kh,false);
    for(let i=0;i<5;i++){ b.setModel(i); renderer.render(scene,oc); x.drawImage(canvas,KB[i][0],KB[i][1]); }
    b.kenParts.forEach(o=>o.visible=false);
    const r=TR*1.03, ty=TC.y-CEN.y;
    oc.left=-r; oc.right=r; oc.top=ty+r; oc.bottom=ty-r; oc.updateProjectionMatrix();
    renderer.setSize(bs,bs,false);
    for(let i=0;i<5;i++){ b.setModel(i); renderer.render(scene,oc); x.drawImage(canvas,BB[i][0],BB[i][1]); }
    scene.remove(b.group);
  }else{
    // secours sans 3D : dessins simples
    for(let i=0;i<5;i++){ const [bx,by,bw,bh]=KB[i], m=M[i];
      x.fillStyle=m.ken; x.fillRect(bx+bw*.38,by+bh*.5,bw*.24,bh*.5); x.fillRect(bx,by+bh*.52,bw,bh*.13);
      x.fillStyle=m.tama; x.beginPath(); x.arc(bx+bw/2,by+bh*.15,bh*.148,0,7); x.fill();
      x.beginPath(); x.arc(BB[i][0]+bs/2,BB[i][1]+bs/2,bs*.48,0,7); x.fill(); }
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  document.documentElement.style.setProperty('--sheet',`url("${URL.createObjectURL(blob)}")`);
}

function finishReveal(){ if(!rv)return; root.style.setProperty('--flav',rv.col); root.style.setProperty('--rv','transparent'); revealEl.style.maskImage=revealEl.style.webkitMaskImage=''; rv=null; }

function goTo(n,dur){

/* --- arc --- */
const SL=[[0,0,430,0,0],[245,24,330,4,16],[452,44,312,8,26],[660,80,296,12,34],[860,118,280,15,40]];
function arcState(k,j,now,top){
  const a=Math.min(Math.abs(k),4), i=Math.floor(a), f=a-i, A=SL[i], B=SL[Math.min(i+1,4)], L=n=>A[n]+(B[n]-A[n])*f, s=Math.sign(k);
  const st={x:cx+s*L(0)*u*spread, y:top+cyRel+L(1)*u, h:L(2)*u, rz:s*L(3), ry:s*L(4), rx:0, z:-a*34*u, op:Math.abs(k)<=3.3?1:clamp(1-(Math.abs(k)-3.3)/.6), shadow:1, sx:1, sy:1};
  if(!RM){ const b=Math.sin(now/4600*2*Math.PI+1.37*j); st.y-=(.5*b+.5)*9*u; st.rz+=.4*b; }
  return st;
}
function place(b,s){
  const off=s.x<-s.h||s.x>vw+s.h||s.y<-s.h||s.y>vh+s.h;
  if(s.op<=.01||off){ b.group.visible=false; b.shadow.visible=false; return; }
  b.group.visible=b.shadow.visible=true;
  const sc=s.h/BH, X=s.x-vw/2, Y=vh/2-s.y;
  b.group.position.set(X,Y,s.z); b.group.scale.set(sc*s.sx,sc*s.sy,sc);
  b.group.rotation.set(s.rx*RAD,s.ry*RAD,-s.rz*RAD);
  b.setOp(s.op);
  b.shadow.position.set(X,Y-.05*s.h,s.z-.32*s.h); b.shadow.rotation.z=-s.rz*RAD;
  b.shadow.scale.set(sc*Math.max(.3,Math.abs(Math.cos(s.ry*RAD))),sc,1);
  b.shadowM.opacity=.5*s.op*s.shadow;
}
const mixS=(a,b,t)=>{ const o={}; for(const k in a)o[k]=lerp(a[k],b[k],t); return o; };

function pokeScale(now){ const t=(now-pokeT0)/500; if(t<0||t>=1)return [1,1];
  if(t<.3){ const k=t/.3; return [lerp(1,1.06,k),lerp(1,.93,k)]; }
  if(t<.6){ const k=(t-.3)/.3; return [lerp(1.06,.97,k),lerp(.93,1.04,k)]; }
  const k=(t-.6)/.4; return [lerp(.97,1,k),lerp(1.04,1,k)]; }

/* --- panier --- */
let cart=0; const badge=$('#badge'), basket=$('#basket');
function addCart(n){ cart+=n; badge.textContent=cart; badge.classList.add('has');
  if(!RM) badge.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:350,easing:'ease-out'}); }
function fly(srcs,done){
  if(RM||!srcs.length){ done&&done(); return; }
  const br=basket.getBoundingClientRect(), bx=br.left+br.width/2, by=br.top+br.height/2;
  srcs.forEach((s,i)=>{
    const r=s.getBoundingClientRect(), cs=getComputedStyle(s), e=document.createElement('i');
    e.className='fly spr'; e.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background-size:${cs.backgroundSize};background-position:${cs.backgroundPosition}`;
    document.body.appendChild(e);
    const dx=bx-(r.left+r.width/2), dy=by-(r.top+r.height/2), k=Math.min(.2,30/r.height), lift=Math.min(160,.35*Math.abs(dy)+60);
    e.animate([{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},
      {transform:`translate(${dx*.4}px,${dy*.4-lift}px) scale(${.45+k}) rotate(-10deg)`,opacity:1,offset:.45},
      {transform:`translate(${dx}px,${dy}px) scale(${k}) rotate(-18deg)`,opacity:.15}],
      {duration:900,delay:i*120,easing:'cubic-bezier(.5,0,.2,1)',fill:'both'}).onfinish=()=>{
        e.remove(); basket.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:320});
        if(i===srcs.length-1) done&&done(); };
  });
}

/* --- pack de 3 --- */
const slots=$$('.slot'), pack=[null,null,null], buy=$('#buy'), glow=$('#glow'); let touched=false, buyTimer=0; const thumbs=[];
function mkBuilder(){
  slots.forEach((s,i)=>{ s.innerHTML=`<i class="sb spr"></i><button class="x" aria-label="Ajouter ou enlever un kendama"><svg viewBox="0 0 10 10"><path d="M5 1v8M1 5h8"/></svg></button>`;
    s.querySelector('.x').addEventListener('click',()=>{ touched=true; if(pack[i]!==null){ pack[i]=null; drawPack(); } }); });
  M.forEach((m,i)=>{ const b=document.createElement('button'); b.className='th'; b.style.setProperty('--c',m.col); b.setAttribute('aria-label','Ajouter '+m.name+' au pack');
    b.innerHTML=`<span class="sq"><i class="spr"></i></span><span>${m.name}</span><em></em>`; spr(b.querySelector('i'),KB[i]);
    b.addEventListener('click',()=>{ touched=true; addPack(i); }); $('#thumbs').appendChild(b); thumbs.push(b); });
  drawPack();
}
function addPack(f){ const k=pack.indexOf(null); if(k<0)return; pack[k]=f; glow.style.setProperty('--g',rgba(M[f].col,.72));
  glow.classList.remove('pulse'); void glow.offsetWidth; glow.classList.add('pulse'); drawPack(); }
function drawPack(){
  slots.forEach((s,i)=>{ const f=pack[i]; if(f!==null) spr(s.querySelector('.sb'),KB[f]); s.classList.toggle('full',f!==null); });
  thumbs.forEach((t,i)=>{ const n=pack.filter(p=>p===i).length, e=t.querySelector('em'); e.textContent=n>1?n:n?'✓':''; e.classList.toggle('has',n>0); });
  if(buy.classList.contains('done'))return;
  const left=pack.filter(p=>p===null).length; buy.disabled=left>0;
  buy.querySelector('.lb').textContent=left?`Encore ${left} à choisir`:'Ajouter au panier';
}
buy.addEventListener('click',()=>{
  if(buy.disabled||buy.classList.contains('done'))return; touched=true;
  fly(slots.map(s=>s.querySelector('.sb')),()=>addCart(1));
  setTimeout(()=>{ buy.classList.add('done'); buy.querySelector('.lb').textContent='Ajouté au panier'; pack.fill(null);
    slots.forEach(s=>s.classList.remove('full')); thumbs.forEach(t=>{ const e=t.querySelector('em'); e.textContent=''; e.classList.remove('has'); });
    clearTimeout(buyTimer); buyTimer=setTimeout(()=>{ buy.classList.remove('done'); drawPack(); },1600); },60);
});

/* --- barre du haut --- */
const navEl=$('#nav'), pill=$('#pill'), links=$$('#pill a'), secs=[hero,inside,shop,rangeEl]; let navAct=-1;
function navHL(){ const a=links[Math.max(0,navAct)], h=pill.querySelector('.hl'); h.style.left=a.offsetLeft+'px'; h.style.width=a.offsetWidth+'px'; }
function stepNav(){ let a=0; secs.forEach((s,i)=>{ if(s.getBoundingClientRect().top<vh*.35)a=i; });
  if(a===navAct)return; navAct=a; links.forEach((l,i)=>l.classList.toggle('on',i===a)); pill.classList.toggle('light',a===2); navEl.classList.toggle('dark',a===3); navHL(); }
$$('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); wheel.on=false;
  const t=$(a.getAttribute('href')); scrollTo({top:t.getBoundingClientRect().top+scrollY,behavior:RM?'auto':'smooth'}); }));

/* --- défilement doux (souris / pavé tactile) --- */
const wheel={on:false,target:0,cur:0};
const fineHover=matchMedia('(hover:hover) and (pointer:fine)').matches;
addEventListener('wheel',e=>{
  if(!fineHover||e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)||document.body.classList.contains('locked'))return;
  e.preventDefault();
  const max=document.documentElement.scrollHeight-innerHeight, d=e.deltaY*(e.deltaMode===1?32:e.deltaMode===2?innerHeight:1);
  if(!wheel.on){ wheel.on=true; wheel.target=wheel.cur=scrollY; }
  wheel.target=clamp(wheel.target+d,0,max);
  if(RM){ scrollTo(0,wheel.target); wheel.on=false; }
},{passive:false});
['keydown','pointerdown'].forEach(t=>addEventListener(t,()=>{ wheel.on=false; },true));
function stepWheel(dt){ if(!wheel.on)return; wheel.cur+=(wheel.target-wheel.cur)*(1-Math.exp(-dt/120));
  if(Math.abs(wheel.target-wheel.cur)<.5){ wheel.cur=wheel.target; wheel.on=false; } scrollTo(0,wheel.cur); }

/* --- glisser, toucher, cliquer sur l'arc --- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function hitBar(x,y){ if(!GL)return null; ndc.set(x/vw*2-1,-(y/vh)*2+1); ray.setFromCamera(ndc,camera);
  const objs=[...pool,trav].filter(b=>b.group.visible).map(b=>b.group), h=ray.intersectObjects(objs,true); return h.length?h[0].object.userData.bar:null; }
const drag={down:false,on:false,x0:0,pos0:0,v:0,lx:0,lt:0,id:0};
const act=()=>{ lastAct=performance.now(); };
arcEl.addEventListener('pointerdown',e=>{ if(e.button!==0||!entered)return; act(); Object.assign(drag,{down:true,on:false,x0:e.clientX,pos0:pos,v:0,lx:e.clientX,lt:performance.now(),id:e.pointerId}); });
arcEl.addEventListener('pointermove',e=>{
  if(!drag.down){ if(e.pointerType==='mouse') arcEl.style.cursor=hitBar(e.clientX,e.clientY)?'pointer':'grab'; return; }
  act(); const dx=e.clientX-drag.x0, slot=245*u*spread;
  if(!drag.on){ if(Math.abs(dx)<=6)return; drag.on=true; tw=null; drag.pos0=pos; drag.x0=e.clientX; try{arcEl.setPointerCapture(e.pointerId)}catch(_){} document.body.classList.add('dragging'); return; }
  pos=drag.pos0-dx/slot;
  const now=performance.now(), dt=Math.max(1,now-drag.lt); drag.v=lerp(drag.v,-(e.clientX-drag.lx)/slot/dt,.4); drag.lx=e.clientX; drag.lt=now;
});
function endDrag(e,cancel){
  if(!drag.down)return; drag.down=false; act();
  if(drag.on){ drag.on=false; document.body.classList.remove('dragging');
    if(cancel&&Math.abs(pos-Math.round(pos))<.02){ pos=Math.round(pos); snapTo(pos); return; }
    snapTo(Math.round(pos+clamp(drag.v*220,-2,2)));
  }else if(!cancel){ const b=hitBar(e.clientX,e.clientY); if(b&&b.k) goTo(target+b.k); }
}
function snapTo(to){ goTo(to,Math.max(380,650*Math.min(1,Math.abs(to-pos)+.35))); if(!tw&&!RM){ target=to; changeFlavour(mod(to,5),1); } }
arcEl.addEventListener('pointerup',e=>endDrag(e,false));
arcEl.addEventListener('pointercancel',e=>endDrag(e,true));
$('#play').addEventListener('click',()=>{ act(); goTo(target+1); });
const autoBtn=$('#auto'); autoBtn.setAttribute('aria-pressed',autoOn);
autoBtn.addEventListener('click',()=>{ autoOn=!autoOn; autoBtn.setAttribute('aria-pressed',autoOn); act(); });
const heroVis=()=>{ const r=hero.getBoundingClientRect(); return clamp((Math.min(vh,r.bottom)-Math.max(0,r.top))/r.height); };
addEventListener('keydown',e=>{ if(!entered||heroVis()<.5)return; if(e.key==='ArrowRight'){ act(); goTo(target+1); } if(e.key==='ArrowLeft'){ act(); goTo(target-1); } });
['pointerdown','touchstart','wheel'].forEach(t=>addEventListener(t,act,{passive:true}));

/* ============ boucle d'animation ============ */
let lastT=0, p3Seen=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(64,now-lastT||16); lastT=now;
  stepWheel(dt);
  if(tw){ const t=clamp((now-tw.t0)/tw.dur); pos=lerp(tw.from,tw.to,tw.ease(t)); if(tw.fire&&t>=.12){ const f=tw.fire; tw.fire=null; f(); } if(t>=1)tw=null; }
  stepReveal(now);
  if(entered&&autoOn&&!drag.down&&!tw&&!document.hidden&&now-lastAct>3200&&heroVis()>=.6){ lastAct=now; goTo(target+1); }
  stepNav();

  const hr=hero.getBoundingClientRect(), ir=inside.getBoundingClientRect(), sr=shop.getBoundingClientRect();
  // section 2
  const p=clamp(-ir.top/(ir.height-vh)), step=Math.floor(Math.min(p,.759)/.19), q=clamp((p-.76)/.24);
  if(step!==curStep) setStep(step,now);
  const vis=ir.top<vh&&ir.bottom>0;
  inFront.style.visibility=vis?'visible':'hidden';
  if(vis){ const pinY=ir.top>0?ir.top:ir.bottom<vh?ir.bottom-vh:0;
    inFront.style.transform=`translateY(${pinY}px)`;
    fFront.style.opacity=fBack.style.opacity=1-clamp(4*q); fFront.style.visibility=q>=.25?'hidden':'';
    inDark.style.opacity=clamp(3.5*q)*.42; }
  stepStorm(vis?q:0);
  if(!GL)return;

  // le voyageur : un seul kendama, du héros jusqu'à sa carte
  const jT=Math.round(target), p1=clamp(1-ir.top/vh), p3=clamp((vh-sr.top)/(.7*vh));
  let S=arcState(jT-pos,jT,now,hr.top); trav.k=0;
  if(p1>0){
    const br=inBar.getBoundingClientRect();
    const B={x:br.left+br.width/2,y:br.top+br.height/2+(RM?0:Math.sin(now/2600*2*Math.PI)*6),h:br.height,rz:14,ry:flipAngle(now)+(RM?0:720*q),rx:0,z:0,op:1,shadow:1,sx:1,sy:1};
    S=mixS(S,B,eio(p1));
    if(p3>0){
      if(phone&&!p3Seen){ p3Seen=true; const c=cards[flav].el; cardsEl.scrollTo({left:c.offsetLeft-(cardsEl.clientWidth-c.offsetWidth)/2,behavior:'smooth'}); }
      const pr=cards[flav].pk.getBoundingClientRect(), [sx,sy]=pokeScale(now);
      const C={x:pr.left+pr.width/2,y:pr.top+pr.height/2,h:pr.height,rz:0,ry:Math.round(B.ry/360)*360+liveTilt.x*14,rx:-liveTilt.y*14,z:0,op:1,shadow:.7,sx,sy};
      S=mixS(B,C,eio(p3));
    }else p3Seen=false;
  }
  trav.setModel(mod(jT,5)); place(trav,S);
  const fade=1-clamp(1.6*p1), j0=Math.floor(pos)-5;
  pool.forEach((b,i)=>{ const j=j0+i; b.k=j-jT;
    if(j===jT||fade<=.01){ b.group.visible=b.shadow.visible=false; return; }
    const s=arcState(j-pos,j,now,hr.top); s.op*=fade; b.setModel(mod(j,5)); place(b,s); });
  renderer.render(scene,camera);
}

/* ============ intro puis entrée ============ */
const intro=$('#intro'); let introDone=false;
function enter(){
  if(entered)return; entered=true; introDone=true;
  intro.classList.add('gone'); document.body.classList.remove('locked'); document.body.classList.add('in');
  lastAct=performance.now();
  if(RM){ pos=1; } else tw={from:-2.6,to:1,t0:performance.now(),dur:1700,ease:sweep,fire:null};
  startBits();
}
function showLogo(){ if(introDone)return; introDone=true; intro.classList.add('logo'); setTimeout(enter,380+650); }
function playIntro(){
  if(RM){ enter(); return; }
  const r=rng(99), bu=$('.burst'), R=Math.hypot(innerWidth,innerHeight)*.62;
  for(let i=0;i<34;i++){ const e=document.createElement('i'); e.className='spr'; spr(e,BB[Math.floor(r()*5)]);
    const s=60+r()*90, a=r()*Math.PI*2, d=(.35+r()*.75)*R, z=1.6+r()*3.4, rot=(r()-.5)*400;
    e.style.cssText+=`;width:${s}px;height:${s}px;margin:${-s/2}px 0 0 ${-s/2}px`;
    bu.appendChild(e);
    e.animate([{transform:'translate(0,0) scale(.05) rotate(0deg)',opacity:0,filter:'blur(0px)'},{opacity:1,offset:.12},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(${z}) rotate(${rot}deg)`,opacity:1,filter:`blur(${z>3.6?5:0}px)`}],
      {duration:1500+r()*900,delay:r()*900,easing:'cubic-bezier(.12,.6,.25,1)',fill:'both'}); }
  setTimeout(showLogo,2700);
}
$('#skip').addEventListener('click',enter);
setTimeout(enter,9000);

/* ============ démarrage ============ */
(async function init(){
  try{ await Promise.all(['400 20px "Archivo Black"','400 20px "DM Mono"','500 20px "DM Mono"','700 20px Inter'].map(f=>document.fonts.load(f))); }catch(e){}
  M.forEach((m,i)=>TEX.push({wood:woodTex(m),tama:tamaTex(m,i)}));
  shadowTex=mkShadowTex();
  await buildSheet();
  if(GL){ for(let i=0;i<11;i++)pool.push(new Bar()); trav=new Bar(); [...pool,trav].forEach(b=>{ scene.add(b.shadow); scene.add(b.group); b.group.visible=b.shadow.visible=false; }); }
  mkBits(); mkStorm(); mkShop(); mkBuilder();
  stepText(0); iconBtns[0].classList.add('on');
  setTitle(M[flav].name,1,false);
  measure();
  addEventListener('resize',measure);
  document.fonts.ready.then(()=>{ fitTitle(); navHL(); });
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); } }),{threshold:.18});
  $$('.lines,.shop-cap,.cards').forEach(e=>io.observe(e));
  new IntersectionObserver((es,o)=>es.forEach(e=>{ if(!e.isIntersecting)return; o.disconnect();
    if(!touched)[0,1,2].forEach(k=>setTimeout(()=>{ if(!touched)addPack(mod(flav+k,5)); },250+160*k)); }),{threshold:.3}).observe(rangeEl);
  requestAnimationFrame(frame);
  playIntro();
})();
</script>
