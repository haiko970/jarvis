:root{
  --ink:#1c1a1f;--cream:#f0e8e0;--dark:#191a1e;--flav:#1d1826;--glow:#7345b6;--rv:transparent;
  --ease:cubic-bezier(.22,.8,.24,1);
  --u:min(calc(100vw / 1440),calc(100vh / 900));
  --w:calc(100vw / 1440);
  --n:min(calc(100vw / 1440),1px);
  --ka:.405;--pu:.7px;--sheet:none;--df:"Archivo Black";--dw:400;--dl:-.02em;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.disp{font-family:var(--df),Impact,sans-serif;font-weight:var(--dw);text-transform:uppercase;letter-spacing:var(--dl);line-height:.92}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.spr{background-image:var(--sheet);background-repeat:no-repeat}
#gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:2;pointer-events:none;display:block}

/* ---------- barre du haut ---------- */
.nav{position:fixed;top:-120px;left:0;right:0;z-index:50;height:calc(94*var(--n));padding:0 calc(37*var(--n)) 0 calc(42*var(--n));display:flex;align-items:center;justify-content:space-between;color:var(--ink);transition:top .9s cubic-bezier(.22,.9,.24,1),color .3s}
body.in .nav{top:0}
.brand{display:flex;align-items:center;gap:calc(10*var(--n));font-weight:800;font-size:calc(15.5*var(--n));letter-spacing:.06em}
.mark{width:calc(36*var(--n));height:calc(36*var(--n));border-radius:50%;background:var(--ink);display:grid;place-items:center;transition:background .3s}
.mark svg{width:58%;height:58%;fill:var(--cream);transition:fill .3s}
.pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;padding:calc(5*var(--n));border:1.5px solid rgba(255,255,255,.5);border-radius:99px;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .3s,background .3s}
.pill.light{border-color:rgba(28,26,31,.14);background:rgba(255,255,255,.35)}
.pill a{position:relative;z-index:1;padding:calc(9*var(--n)) calc(18*var(--n));font-size:calc(14.5*var(--n));font-weight:500;border-radius:99px;color:var(--ink);white-space:nowrap}
.pill a.on{font-weight:600}
.pill .hl{position:absolute;top:calc(5*var(--n));bottom:calc(5*var(--n));left:0;width:0;border-radius:99px;background:#fff;transition:left .5s var(--ease),width .5s var(--ease)}
.nav-r{display:flex;align-items:center;gap:calc(8*var(--n))}
.chip{height:calc(37*var(--n));padding:0 calc(14*var(--n));border:1.5px solid currentColor;border-radius:99px;font-size:calc(13*var(--n));font-weight:600;display:flex;align-items:center}
#basket{position:relative;width:calc(44*var(--n));height:calc(37*var(--n));padding:0;justify-content:center}
#basket svg{width:calc(18*var(--n));height:calc(18*var(--n));stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ink);color:#fff;font:500 10.5px "DM Mono",monospace;display:grid;place-items:center;transform:scale(0)}
#badge.has{transform:scale(1)}
.dibs{height:calc(37*var(--n));padding:0 calc(18*var(--n));border-radius:99px;background:var(--ink);color:var(--cream);font-size:calc(14.5*var(--n));font-weight:600;transition:background .3s,color .3s}
.nav.dark{color:var(--cream)}
.nav.dark .mark{background:var(--cream)}.nav.dark .mark svg{fill:var(--ink)}
.nav.dark .dibs{background:#8fa8a3;color:var(--ink)}
.nav.dark #badge{background:var(--cream);color:var(--ink)}
.nav.dark .pill{border-color:rgba(240,232,224,.5)}
.nav.dark .pill a{color:var(--cream)}.nav.dark .pill a.on{color:var(--ink)}

/* ---------- 1. héros ---------- */
.hero{position:relative;height:100svh;min-height:300px;overflow:hidden;background:var(--flav)}
.reveal{position:absolute;inset:0;background:var(--rv)}
.rings{position:absolute;left:50%;top:41%;width:calc(2200*var(--u));height:calc(2200*var(--u));margin:calc(-1100*var(--u)) 0 0 calc(-1100*var(--u));background:repeating-radial-gradient(circle,rgba(255,255,255,.05) 0,rgba(255,255,255,0) calc(2*var(--u)),rgba(255,255,255,0) calc(79*var(--u)),rgba(255,255,255,.05) calc(80*var(--u)));-webkit-mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);opacity:0;transform:scale(.85);transition:opacity 1.1s ease-out,transform 1.1s ease-out}
body.in .rings{opacity:1;transform:none}
.rays{position:absolute;left:50%;top:41%;width:calc(1700*var(--u));height:calc(1700*var(--u));margin:calc(-850*var(--u)) 0 0 calc(-850*var(--u));border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0deg,rgba(255,255,255,0) 7deg,rgba(255,255,255,0) 15deg,rgba(255,255,255,.04) 20deg,rgba(255,255,255,0) 26deg,rgba(255,255,255,0) 36deg);-webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 28%,transparent 62%);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 28%,transparent 62%);animation:turn 70s linear infinite;opacity:0;transition:opacity 1.4s .3s;pointer-events:none}
.halo{position:absolute;left:50%;top:41%;width:calc(760*var(--u));height:calc(760*var(--u));margin:calc(-380*var(--u)) 0 0 calc(-380*var(--u));border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 42%,transparent) 0,color-mix(in srgb,var(--glow) 14%,transparent) 38%,transparent 68%);animation:breathe 5.2s ease-in-out infinite;opacity:0;transition:opacity 1.4s .3s;pointer-events:none}
body.in .rays{opacity:.9}body.in .halo{opacity:1}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
.in-halo{position:absolute;left:830px;top:440px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 40%,transparent) 0,color-mix(in srgb,var(--glow) 13%,transparent) 38%,transparent 68%);animation:breathe 5.2s ease-in-out infinite}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(90% 62% at 50% 50%,color-mix(in srgb,var(--g) 34%,transparent) 0,transparent 70%),linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
.bits{display:none}
.bit{position:absolute;filter:blur(1.5px);opacity:0;border-radius:50%}
.arc{position:absolute;inset:0;touch-action:pan-y;cursor:grab}
#title{position:absolute;z-index:60;left:0;right:0;top:calc(50% + 265*var(--u));text-align:center;font-size:calc(96*var(--u));color:var(--cream);pointer-events:none;white-space:nowrap}
#title .tl{display:block}
#title .tl.old{position:absolute;left:0;right:0;top:0}
#title .w{display:inline-block;white-space:nowrap}
#title .l{display:inline-block}
#count{position:absolute;z-index:1;top:calc(50% + 215*var(--u));right:calc(50% - 692*var(--u));font-size:calc(200*var(--u));color:transparent;-webkit-text-stroke:1.2px rgba(255,255,255,.45);pointer-events:none}
#play{position:absolute;z-index:60;left:50%;top:calc(50% + 200*var(--u));width:calc(52*var(--u));height:calc(52*var(--u));margin:calc(-26*var(--u)) 0 0 calc(-26*var(--u));border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(40,28,60,.12);display:grid;place-items:center;transition:transform .25s var(--ease),opacity .6s}
#play svg{width:calc(18*var(--u));height:calc(18*var(--u));stroke:var(--ink);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
#play:hover{transform:scale(1.08)}#play:hover svg{transform:translateX(2px)}#play:active{transform:scale(.94)}
#auto{position:absolute;z-index:60;right:calc(50% - 680*var(--u));top:calc(50% + 170*var(--u));display:flex;align-items:center;gap:9px;color:#fff;font:500 11px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
#auto i{width:26px;height:26px;border:1.3px solid #fff;border-radius:50%;display:grid;place-items:center}
#auto svg{width:10px;height:10px;fill:#fff}
#auto .pl{display:none}#auto[aria-pressed=false] .pl{display:block}#auto[aria-pressed=false] .pa{display:none}
#play,#count,#auto{opacity:0}
body.in #play{opacity:1;transition:opacity .6s .5s,transform .25s var(--ease)}
body.in #count{opacity:1;transition:opacity .6s .62s}
body.in #auto{opacity:1;transition:opacity .6s .74s}

/* ---------- 2. dedans ---------- */
#inside{position:relative;height:500vh;background:var(--flav)}
.pin{position:sticky;top:0;height:100svh;overflow:hidden}
.in-dark{position:absolute;inset:0;background:#120d16;opacity:0}

const ROPE_A=new THREE.Vector3(0,TC.y+TR-0.03,0), ROPE_B=new THREE.Vector3(0.1,10.85,1.1);

const _v=new THREE.Vector3(), _t=new THREE.Vector3(), _n1=new THREE.Vector3(), _n2=new THREE.Vector3(), _qi=new THREE.Quaternion(), _Z=new THREE.Vector3(0,0,1), _X=new THREE.Vector3(1,0,0);
function ropeCollide(l){            // l : point dans le repère du kendama (cm) ; on le sort du bois et de la boule
  const m=RRAD+.05;
  let dx=l.x-TC.x, dy=l.y-TC.y, dz=l.z-TC.z, d=Math.hypot(dx,dy,dz);
  if(d<TR+m&&d>1e-4){ const k=(TR+m)/d; l.set(TC.x+dx*k,TC.y+dy*k,TC.z+dz*k); }
  if(l.y>-.2&&l.y<12.2){            // manche et pied
    const r=(l.y<4.35?2.05:Math.max(.55,1.45-(l.y-4.35)*.16))+m, q=Math.hypot(l.x,l.z);
    if(q<r&&q>1e-4){ l.x*=r/q; l.z*=r/q; } }
  if(Math.abs(l.x)<4){              // croix et coupelles
    const a=Math.abs(l.x)/3.9, r=1.05+a*a*1.42+m, y=l.y-11, q=Math.hypot(y,l.z);
    if(q<r&&q>1e-4){ l.y=11+y*r/q; l.z*=r/q; } }
}
class Rope{
  constructor(){
    this.p=[]; this.o=[]; this.last=null;
    for(let i=0;i<RN;i++){ const t=i/(RN-1), v=new THREE.Vector3().lerpVectors(ROPE_A,ROPE_B,t).sub(CEN); v.z+=Math.sin(t*Math.PI)*3.4; v.x-=Math.sin(t*Math.PI)*1.5; this.p.push(v); this.o.push(v.clone()); }
    const g=new THREE.BufferGeometry(), n=RM_*RSIDES, idx=[];
    this.pos=new Float32Array(n*3); this.nor=new Float32Array(n*3);
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3)); g.setAttribute('normal',new THREE.BufferAttribute(this.nor,3));
    for(let i=0;i<RM_-1;i++)for(let s=0;s<RSIDES;s++){ const a=i*RSIDES+s, b=i*RSIDES+(s+1)%RSIDES, c=a+RSIDES, d=b+RSIDES; idx.push(a,c,b,b,c,d); }
    g.setIndex(idx); this.geo=g; this.q=new THREE.Quaternion();
    for(let i=0;i<260;i++)this.sim(this.q,0,0,0); this.build(this.q);
  }
  // un pas de simulation ; q : orientation du kendama ; (kx,ky,kz) : son déplacement, en cm
  sim(q,kx,ky,kz){
    const P=this.p,O=this.o; _qi.copy(q).invert();
    for(let i=1;i<RN-1;i++){ const a=P[i], b=O[i]; let vx=(a.x-b.x)*.94, vy=(a.y-b.y)*.94, vz=(a.z-b.z)*.94;
      const sp=Math.hypot(vx,vy,vz); if(sp>.45){ const k=.45/sp; vx*=k; vy*=k; vz*=k; }      // jamais plus vite que ça
      b.copy(a); a.x+=vx-kx; a.y+=vy-.05-ky; a.z+=vz-kz; }
    for(let it=0;it<12;it++){
      P[0].copy(ROPE_A).sub(CEN).applyQuaternion(q); P[RN-1].copy(ROPE_B).sub(CEN).applyQuaternion(q);
      for(let i=0;i<RN-1;i++){ const a=P[i], b=P[i+1]; _v.subVectors(b,a); const d=_v.length()||1e-4, f=(d-RSEG)/d*.5;
        if(i>0)a.addScaledVector(_v,f*(i===RN-2?2:1)); if(i<RN-2)b.addScaledVector(_v,-f*(i===0?2:1)); }
      for(let i=1;i<RN-1;i++){ _v.copy(P[i]).applyQuaternion(_qi).add(CEN); ropeCollide(_v); P[i].copy(_v.sub(CEN).applyQuaternion(q)); }
    }
    // la ficelle ne s'étire pas : on resserre depuis chaque bout
    for(let i=1;i<RN-1;i++){ _v.subVectors(P[i],P[i-1]); const d=_v.length(); if(d>RSEG)P[i].copy(P[i-1]).addScaledVector(_v,RSEG/d); }
    for(let i=RN-2;i>0;i--){ _v.subVectors(P[i],P[i+1]); const d=_v.length(); if(d>RSEG)P[i].copy(P[i+1]).addScaledVector(_v,RSEG/d); }
  }
  build(q){
    _qi.copy(q).invert(); const L=this.l||(this.l=this.p.map(()=>new THREE.Vector3())), C=this.c||(this.c=Array.from({length:RM_},()=>new THREE.Vector3()));
    for(let i=0;i<RN;i++)L[i].copy(this.p[i]).applyQuaternion(_qi).add(CEN);
    // courbe lissée (Catmull-Rom) qui passe par les points simulés
    for(let i=0;i<RN-1;i++){ const p0=L[Math.max(i-1,0)], p1=L[i], p2=L[i+1], p3=L[Math.min(i+2,RN-1)];
      for(let s=0;s<RSUB;s++){ const t=s/RSUB, t2=t*t, t3=t2*t, o=C[i*RSUB+s];
        o.x=.5*(2*p1.x+(p2.x-p0.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(3*p1.x-p0.x-3*p2.x+p3.x)*t3);
        o.y=.5*(2*p1.y+(p2.y-p0.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(3*p1.y-p0.y-3*p2.y+p3.y)*t3);
        o.z=.5*(2*p1.z+(p2.z-p0.z)*t+(2*p0.z-5*p1.z+4*p2.z-p3.z)*t2+(3*p1.z-p0.z-3*p2.z+p3.z)*t3); } }
    C[RM_-1].copy(L[RN-1]);
    for(let i=0;i<RM_;i++){
      _t.subVectors(C[Math.min(i+1,RM_-1)],C[Math.max(i-1,0)]).normalize();
      _n1.crossVectors(_t,_Z); if(_n1.lengthSq()<1e-4)_n1.crossVectors(_t,_X); _n1.normalize(); _n2.crossVectors(_t,_n1).normalize();
      for(let s=0;s<RSIDES;s++){ const a=s/RSIDES*Math.PI*2, c=Math.cos(a), sn=Math.sin(a), k=(i*RSIDES+s)*3;
        const nx=_n1.x*c+_n2.x*sn, ny=_n1.y*c+_n2.y*sn, nz=_n1.z*c+_n2.z*sn;
        this.nor[k]=nx; this.nor[k+1]=ny; this.nor[k+2]=nz;
        this.pos[k]=C[i].x+nx*RRAD; this.pos[k+1]=C[i].y+ny*RRAD; this.pos[k+2]=C[i].z+nz*RRAD; } }
    this.geo.attributes.position.needsUpdate=this.geo.attributes.normal.needsUpdate=true;
  }
  // appelé à chaque image pour un kendama visible
  step(group){
    const sc=group.scale.y||1, w=group.position; let kx=0,ky=0,kz=0;
    if(this.last){ kx=(w.x-this.last.x)/sc; ky=(w.y-this.last.y)/sc; kz=(w.z-this.last.z)/sc;
      const d=Math.hypot(kx,ky,kz); if(d>6){ kx=ky=kz=0; } else { const k=.3*Math.min(1,.5/(d*.3+1e-6)); kx*=k; ky*=k; kz*=k; } }
    (this.last||(this.last=new THREE.Vector3())).copy(w);
    const n=clamp(Math.round(FDT/16.7),1,4);                 // même vitesse quel que soit le nombre d'images par seconde
    for(let i=0;i<n;i++)this.sim(group.quaternion,kx/n,ky/n,kz/n);
    this.build(group.quaternion);
  }
}

let WOODT=null, WOODB=null;
const loadImg=src=>new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
async function loadAssets(){
  const [d,b]=await Promise.all([loadImg(ASSET.wood),loadImg(ASSET.bump)]);
  const mk=(img,srgb)=>{ const t=new THREE.Texture(img); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; if(srgb)t.colorSpace=THREE.SRGBColorSpace; t.needsUpdate=true; return t; };
  WOODT=mk(d,true); WOODB=mk(b,false); WOODT.offset.x=WOODB.offset.x=.25;
  if(!GL)return;
  try{
    const bin=Uint8Array.from(atob(ASSET.env),c=>c.charCodeAt(0));
    const {RGBELoader}=await import('three/addons/loaders/RGBELoader.js');
    const td=new RGBELoader().parse(bin.buffer);
    const t=new THREE.DataTexture(td.data,td.width,td.height,THREE.RGBAFormat,td.type);
    t.mapping=THREE.EquirectangularReflectionMapping; t.colorSpace=THREE.LinearSRGBColorSpace; t.minFilter=t.magFilter=THREE.LinearFilter; t.flipY=true; t.needsUpdate=true;
    scene.environment=new THREE.PMREMGenerator(renderer).fromEquirectangular(t).texture;
  }catch(e){ console.warn('éclairage de studio indisponible',e); }
}
function woodTex(m){ return WOODT; }
function tamaTex(m,i){
  const W=1024,H=512,[c,x]=cv2d(W,H);
  x.fillStyle=m.tama; x.fillRect(0,0,W,H);
  // bas de la boule : bande blanche avec « KROM » répété tout autour
  const y0=H*.715; x.fillStyle=BAND; x.fillRect(0,y0,W,H-y0);
  x.fillStyle='#17171a'; x.textAlign='center'; x.textBaseline='middle'; x.font='400 36px "Archivo Black"';
  for(let k=0;k<5;k++){ x.save(); x.translate((k+.5)*W/5,H*.775); x.scale(1.4,1); x.fillText('KROM',0,0); x.restore(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function stickerTex(){
  const [c,x]=cv2d(128,128);
  x.lineJoin='round'; x.beginPath(); x.moveTo(14,22); x.lineTo(114,22); x.lineTo(64,112); x.closePath();
  x.fillStyle='#fdfdfb'; x.fill(); x.lineWidth=9; x.strokeStyle='#2a8fc9'; x.stroke();
  x.beginPath(); x.moveTo(44,42); x.lineTo(84,42); x.lineTo(64,78); x.closePath(); x.fillStyle='#1b1b1d'; x.fill();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
let stickerT;
let shadowTex;
function mkShadowTex(){
  const [c,x]=cv2d(128,256), g=x.createRadialGradient(64,128,0,64,128,64);
  g.addColorStop(0,'rgba(30,18,40,.55)'); g.addColorStop(1,'rgba(30,18,40,0)');
  x.save(); x.translate(0,128); x.scale(1,2); x.translate(0,-128); x.fillStyle=g; x.fillRect(0,64,128,128); x.restore();
  return new THREE.CanvasTexture(c);
}
const shadowGeo=new THREE.PlaneGeometry(1.25*BW,1.04*BH);

/* --- un kendama --- */
class Bar{
  constructor(){
    const pm=o=>new THREE.MeshPhysicalMaterial(Object.assign({transparent:true,metalness:0,envMapIntensity:.42},o));
    this.ken=pm({color:WOOD,roughness:.88,clearcoat:0,side:THREE.DoubleSide,bumpMap:WOODB,bumpScale:.3,envMapIntensity:.42});
    this.tamaM=pm({roughness:.95,clearcoat:0,sheen:.25,sheenRoughness:.8,sheenColor:new THREE.Color(0xffffff),envMapIntensity:.5});
    this.stickM=new THREE.MeshBasicMaterial({map:stickerT,transparent:true,depthWrite:false});
    this.strM=pm({roughness:.9,color:STR});
    this.group=new THREE.Group(); this.group.rotation.order='ZYX';
    const inner=new THREE.Group(); inner.position.copy(CEN).multiplyScalar(-1); this.group.add(inner);
    const add=(g,mat,f)=>{ const me=new THREE.Mesh(g,mat); f&&f(me); inner.add(me); return me; };
    this.kenParts=[
      add(G.body,this.ken),
      add(G.sarado,this.ken,o=>{o.rotation.z=-Math.PI/2;o.position.set(0,11,0)}),
      add((this.rope=new Rope()).geo,this.strM,o=>{o.frustumCulled=false}),
      add(G.bead,this.strM,o=>o.position.copy(ROPE_B)),
      add(G.sticker,this.stickM,o=>{o.position.set(0,1.75,1.8);o.rotation.x=-.2}),                        // autocollant du pied
    ];
    this.kenParts.slice(0,4).forEach(o=>{o.castShadow=o.receiveShadow=true});
    this.tama=add(G.tama,this.tamaM,o=>o.position.copy(TC)); this.tama.castShadow=this.tama.receiveShadow=true;
    add(G.bead,this.strM,o=>{o.position.copy(ROPE_A);o.scale.set(1.15,.6,1.15)});   // petit nœud au sommet de la boule
    this.group.traverse(o=>o.userData.bar=this);
    this.shadowM=new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false});
    this.shadow=new THREE.Mesh(shadowGeo,this.shadowM); this.shadow.renderOrder=-1;
    this.model=-1; this.k=0;
  }
  setModel(i){ if(i===this.model)return; this.model=i; this.ken.map=TEX[i].wood; this.tamaM.map=TEX[i].tama; this.ken.needsUpdate=this.tamaM.needsUpdate=true; }
  setOp(o){ this.ken.opacity=this.tamaM.opacity=this.strM.opacity=this.stickM.opacity=o; }
}

let SW=1,SH=1; const KB=[], BB=[];
function spr(el,b,pad=0){
  const x=b[0]-pad,y=b[1]-pad,w=b[2]+2*pad,h=b[3]+2*pad;
  el.style.backgroundSize=`${SW/w*100}% ${SH/h*100}%`;
  el.style.backgroundPosition=`${x/(SW-w)*100}% ${y/(SH-h)*100}%`;
}
async function buildSheet(){
  const kh=820, kw=Math.round(kh*KA), gap=36, bs=260;
  SW=gap+5*(kw+gap); SH=gap+kh+gap+bs+gap;
  const [c,x]=cv2d(SW,SH);
  for(let i=0;i<5;i++){ KB[i]=[gap+i*(kw+gap),gap,kw,kh]; BB[i]=[gap+i*(kw+gap)+(kw-bs)/2,gap+kh+gap,bs,bs]; }
  if(GL){
    const b=new Bar(); scene.add(b.group); b.group.scale.setScalar(kh/BH);
    const sc=kh/BH, oc=new THREE.OrthographicCamera(-kw/2,kw/2,kh/2,-kh/2,1,6000); oc.position.set(0,0,2500);
    shadowBounds(kw,kh); spot.position.set(-kw*.2,kh*.2,500);
    renderer.setPixelRatio(1); renderer.setSize(kw,kh,false);
    for(let i=0;i<5;i++){ b.setModel(i); renderer.render(scene,oc); x.drawImage(canvas,KB[i][0],KB[i][1]); }
    b.kenParts.forEach(o=>o.visible=false);
    const r=TR*1.03*sc, ty=(TC.y-CEN.y)*sc;
    oc.left=-r; oc.right=r; oc.top=ty+r; oc.bottom=ty-r; oc.updateProjectionMatrix();
    renderer.setSize(bs,bs,false);
    for(let i=0;i<5;i++){ b.setModel(i); renderer.render(scene,oc); x.drawImage(canvas,BB[i][0],BB[i][1]); }
    scene.remove(b.group);
  }else{
    // secours sans 3D : dessins simples
    for(let i=0;i<5;i++){ const [bx,by,bw,bh]=KB[i], m=M[i];
      x.fillStyle=WOOD; x.fillRect(bx+bw*.38,by+bh*.5,bw*.24,bh*.5); x.fillRect(bx,by+bh*.52,bw,bh*.13);
      x.fillStyle=m.tama; x.beginPath(); x.arc(bx+bw/2,by+bh*.15,bh*.148,0,7); x.fill();
      x.beginPath(); x.arc(BB[i][0]+bs/2,BB[i][1]+bs/2,bs*.48,0,7); x.fill(); }
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  document.documentElement.style.setProperty('--sheet',`url("${URL.createObjectURL(blob)}")`);
}

  const hr=hero.getBoundingClientRect(), ir=inside.getBoundingClientRect(), sr=shop.getBoundingClientRect();
  // section 2
  const p=clamp(-ir.top/(ir.height-vh)), step=Math.floor(Math.min(p,.759)/.19), q=clamp((p-.76)/.24);
  if(step!==curStep) setStep(step,now);
  const vis=ir.top<vh&&ir.bottom>0;
  inFront.style.visibility=vis?'visible':'hidden';
  if(vis){ const pinY=ir.top>0?ir.top:ir.bottom<vh?ir.bottom-vh:0;
    inFront.style.transform=`translateY(${pinY}px)`;
    fFront.style.opacity=fBack.style.opacity=1-clamp(4*q); fFront.style.visibility=q>=.25?'hidden':'';
    inDark.style.opacity=clamp(3.5*q)*.42; }
  stepStorm(vis?q:0);
  if(!GL)return;

  // le voyageur : un seul kendama, du héros jusqu'à sa carte
  const jT=Math.round(target), p1=clamp(1-ir.top/vh), p3=clamp((vh-sr.top)/(.7*vh));
  let S=arcState(jT-pos,jT,now,hr.top); trav.k=0;
  if(p1>0){
    const br=inBar.getBoundingClientRect();
    const B={x:br.left+br.width/2,y:br.top+br.height/2+(RM?0:Math.sin(now/2600*2*Math.PI)*6),h:br.height,rz:14,ry:flipAngle(now)+(RM?0:720*q),rx:0,z:0,op:1,shadow:1,sx:1,sy:1};
    S=mixS(S,B,eio(p1));
    if(p3>0){
      if(phone&&!p3Seen){ p3Seen=true; const c=cards[flav].el; cardsEl.scrollTo({left:c.offsetLeft-(cardsEl.clientWidth-c.offsetWidth)/2,behavior:'smooth'}); }
      const pr=cards[flav].pk.getBoundingClientRect(), [sx,sy]=pokeScale(now);
      const C={x:pr.left+pr.width/2,y:pr.top+pr.height/2,h:pr.height,rz:0,ry:Math.round(B.ry/360)*360+liveTilt.x*14,rx:-liveTilt.y*14,z:0,op:1,shadow:.7,sx,sy};
      S=mixS(B,C,eio(p3));
    }else p3Seen=false;
  }
  if(jT!==lastJT){ const A=pool[mod(jT,11)], B=pool[mod(lastJT,11)];
    if(A!==B){ const sw=(u,v)=>{ const r=u.rope; u.rope=v.rope; v.rope=r; const g=u.kenParts[2].geometry; u.kenParts[2].geometry=v.kenParts[2].geometry; v.kenParts[2].geometry=g; };
      sw(trav,A); sw(A,B); }
    lastJT=jT; }
  trav.setModel(mod(jT,5)); place(trav,S);
  const fade=1-clamp(1.6*p1), j0=Math.floor(pos)-5;
  for(let i=0;i<11;i++){ const j=j0+i, b=pool[mod(j,11)]; b.k=j-jT;
    if(j===jT||fade<=.01){ b.group.visible=b.shadow.visible=false; b.rope.last=null; continue; }
    const s=arcState(j-pos,j,now,hr.top); s.op*=fade; b.setModel(mod(j,5)); place(b,s); }
  // la petite lumière suit la souris, sinon elle tourne doucement
  const idle=now-ptr.t>2500||RM, a=now/2600;
  const lx=idle?Math.cos(a)*vw*.3:ptr.x-vw/2, ly=idle?Math.sin(a*1.3)*vh*.22+vh*.12:vh/2-ptr.y;
  spot.position.x+=(lx-spot.position.x)*.08; spot.position.y+=(ly-spot.position.y)*.08; spot.position.z=420;
  renderer.render(scene,camera);
}

/* ============ intro puis entrée ============ */
const intro=$('#intro'); let introDone=false;
function enter(){
  if(entered)return; entered=true; introDone=true;
  intro.classList.add('gone'); document.body.classList.remove('locked'); document.body.classList.add('in');
  lastAct=performance.now();
  if(RM){ pos=1; } else tw={from:-2.6,to:1,t0:performance.now(),dur:1700,ease:sweep,fire:null};
  startBits();
}
function showLogo(){ if(introDone)return; introDone=true; intro.classList.add('logo'); setTimeout(enter,380+650); }
function playIntro(){
  if(RM){ enter(); return; }
  const r=rng(99), bu=$('.burst'), R=Math.hypot(innerWidth,innerHeight)*.62;
  for(let i=0;i<34;i++){ const e=document.createElement('i'); e.className='spr'; spr(e,BB[Math.floor(r()*5)]);
    const s=60+r()*90, a=r()*Math.PI*2, d=(.35+r()*.75)*R, z=1.6+r()*3.4, rot=(r()-.5)*400;
    e.style.cssText+=`;width:${s}px;height:${s}px;margin:${-s/2}px 0 0 ${-s/2}px`;
    bu.appendChild(e);
    e.animate([{transform:'translate(0,0) scale(.05) rotate(0deg)',opacity:0,filter:'blur(0px)'},{opacity:1,offset:.12},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(${z}) rotate(${rot}deg)`,opacity:1,filter:`blur(${z>3.6?5:0}px)`}],
      {duration:1500+r()*900,delay:r()*900,easing:'cubic-bezier(.12,.6,.25,1)',fill:'both'}); }
  setTimeout(showLogo,2700);
}
$('#skip').addEventListener('click',enter);
setTimeout(enter,9000);

/* ============ démarrage ============ */
(async function init(){
  try{ await Promise.all(['400 20px Anton','400 20px "Bebas Neue"','700 20px "Space Grotesk"','800 20px Syne','400 20px "Archivo Black"','400 20px "DM Mono"','500 20px "DM Mono"','700 20px Inter'].map(f=>document.fonts.load(f))); }catch(e){}
  await loadAssets();
  M.forEach((m,i)=>TEX.push({wood:woodTex(m),tama:tamaTex(m,i)}));
  shadowTex=mkShadowTex(); stickerT=stickerTex();
  await buildSheet();
  if(GL){ for(let i=0;i<11;i++)pool.push(new Bar()); trav=new Bar(); [...pool,trav].forEach(b=>{ scene.add(b.shadow); scene.add(b.group); b.group.visible=b.shadow.visible=false; }); }
  mkBits(); mkStorm(); mkShop(); mkBuilder();
  root.style.setProperty('--flav',M[flav].col); root.style.setProperty('--glow',M[flav].glow);
  stepText(0); iconBtns[0].classList.add('on');
  setTitle(M[flav].name,1,false); setFont(fontI);
  measure();
  addEventListener('resize',measure);
  document.fonts.ready.then(()=>{ fitTitle(); navHL(); });
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); } }),{threshold:.18});
  $$('.lines,.shop-cap,.cards').forEach(e=>io.observe(e));
  new IntersectionObserver((es,o)=>es.forEach(e=>{ if(!e.isIntersecting)return; o.disconnect();
    if(!touched)[0,1,2].forEach(k=>setTimeout(()=>{ if(!touched)addPack(mod(flav+k,5)); },250+160*k)); }),{threshold:.3}).observe(rangeEl);
  requestAnimationFrame(frame);
  playIntro();
})();
</script>
