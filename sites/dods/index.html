      font-style: normal;
      font-display: block;
    }

    :root {
      --ink: #ffffff;
      --surface: #161616;
      --orb-reveal: cubic-bezier(.16, 1, .3, 1);
      --orb-soft: cubic-bezier(.25, .8, .28, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #161616;
    }
    body {
      font-family: "Orbit Sans", Arial, Helvetica, sans-serif;
      font-weight: 400;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    *, *::before, *::after { box-sizing: border-box; }

    .viewport {
      position: fixed;
      inset: 0;
      background: var(--surface);
    }
    .stage {
      position: absolute;
      inset: 0;
      contain: strict;
      isolation: isolate;
      overflow: hidden;
    }

    /* ---------- Marque (astérisque) ---------- */
    .brand {
      position: absolute;
      top: 2.141745dvh;
      left: 3.854167vw;
      z-index: 4;
      display: block;
      line-height: 0;
      color: var(--ink);
    }
    .brand-mark {
      display: block;
      width: clamp(34px, min(3.4375vw, 5.2dvh), 66px);
      height: auto;
      overflow: visible;
    }
    .brand-mark line {
      stroke: #fff;
      stroke-width: 5px;
      stroke-linecap: square;
      fill: none;
    }

    /* ---------- Navigation ---------- */
    .primary-nav {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }
    .primary-nav ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .primary-nav li {
      position: absolute;
      top: 3.426791dvh;
      transform-origin: left center;
      white-space: nowrap;
      line-height: 1;
    }
    .primary-nav li:nth-child(1) { left: 10.104167vw; transform: scaleX(1.165); }
    .primary-nav li:nth-child(2) { left: 17.526042vw; transform: scaleX(1.052); }
    .primary-nav li:nth-child(3) { left: 27.578125vw; transform: scaleX(1.126); }
    .primary-nav li:nth-child(4) { left: 36.171875vw; transform: scaleX(1.168); }
    .primary-nav a {
      display: inline-block;
      pointer-events: auto;
      color: #fff;
      text-decoration: none;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      line-height: 1;
    }
    .primary-nav a:hover,
    .primary-nav a:focus-visible { opacity: .72; }
    .primary-nav a:focus-visible,
    .pill:focus-visible,
    .brand:focus-visible,
    .burger:focus-visible,
    .sheet a:focus-visible {
      outline: 2px solid #fd86db;
      outline-offset: 4px;
    }

    /* ---------- Pastille « Saut de la mort » ---------- */
    .pill {
      position: absolute;
      top: 2.336449dvh;
      right: 7.5vw;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: clamp(34px, 4.439252dvh, 57px);
      padding: 0 1.15em;
      border-radius: 999px;
      background: #fff;
      color: #161616;
      text-decoration: none;
      white-space: nowrap;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      letter-spacing: 0.026923em;
      line-height: 1;
    }

    /* ---------- Grand mot DØDS ---------- */
    .orbit-word {
      position: absolute;
      top: 11.565421dvh;
      left: 4.348958vw;
      z-index: 1;
      margin: 0;
      font-family: "Orbit Display", "Times New Roman", Times, serif;
      font-weight: 400;
      font-size: min(27.8125vw, 55dvh);
      line-height: .86;
      letter-spacing: 0.033708em;
      white-space: nowrap;
      user-select: none;
    }
    .orbit-word__mask { display: block; }
    .orbit-word__inner { display: inline-block; }
    .orbit-word__white { color: #fff; }
    .orbit-word__o {
      display: inline-block;
      transform: scaleX(1.0866);
      transform-origin: left center;
      margin-right: 0.042135em;
    }
    .orbit-word__pink {
      background: linear-gradient(180deg, #ffc5dc 0%, #fd86db 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* ---------- Fleur (deux couches) ---------- */
    .flower {
      position: absolute;
      top: 14.749065dvh;
      left: 49.121328vw;
      height: 106.109034dvh;
      z-index: 2;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .flower__sizer {
      display: block;
      height: 100%;
      width: auto;
      visibility: hidden;
    }
    .flower__layer {
      position: absolute;
      inset: 0;
    }
    .flower__layer img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }
    .flower__layer--top {
      -webkit-mask-image: linear-gradient(#0000, #0000);
      mask-image: linear-gradient(#0000, #0000);
    }
    .flower__layer--bg,
    .flower__layer--top {
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
    .trail-canvas { display: none; }

    /* ---------- Textes des coins ---------- */
    .support-copy {
      position: absolute;
      bottom: 4.361371dvh;
      z-index: 3;
      margin: 0;
      color: #f7f7f7;
      font-size: clamp(14px, min(1.40625vw, 2.102804dvh), 27px);
      line-height: 1.18;
      white-space: nowrap;
      transform-origin: left bottom;
    }
    .support-copy--left  { left: 3.177083vw; transform: scaleX(1.073); }
    .support-copy--right { left: 78.28125vw; transform: scaleX(1.058); }
    .support-copy__inner { display: block; }

    /* ---------- Menu mobile (caché sur ordinateur) ---------- */
    .burger,
    .scrim,
    .sheet { display: none; }

    /* ---------- Animation d'entrée ---------- */
    @keyframes orb-word {
      from { transform: translateY(118%); }
      to   { transform: translateY(0); }
    }
    @keyframes orb-subject {
      from { opacity: 0; transform: translateX(-50%) translateY(3.4dvh); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes orb-corner {
      from { opacity: 0; transform: translateY(1.2dvh); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes orb-quiet {
      from { opacity: 0; transform: translateY(.8dvh); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes orb-dim {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes orb-stage {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .anim .brand { animation: orb-quiet 620ms var(--orb-soft) 100ms both; }
    .anim .primary-nav li:nth-child(1) a { animation: orb-dim 550ms var(--orb-soft) 180ms both; }
    .anim .primary-nav li:nth-child(2) a { animation: orb-dim 550ms var(--orb-soft) 225ms both; }
    .anim .primary-nav li:nth-child(3) a { animation: orb-dim 550ms var(--orb-soft) 270ms both; }
    .anim .primary-nav li:nth-child(4) a { animation: orb-dim 550ms var(--orb-soft) 315ms both; }
    .anim .pill { animation: orb-quiet 620ms var(--orb-soft) 340ms both; }
    .anim .orbit-word__mask {
      overflow: hidden;
      padding: .14em .06em .1em;
      margin: -.14em -.06em -.1em;
    }
    .anim .orbit-word__inner { animation: orb-word 1150ms var(--orb-reveal) 300ms both; }
    .anim .flower { animation: orb-subject 1150ms var(--orb-reveal) 660ms both; }
    .anim .support-copy__inner { animation: orb-corner 720ms var(--orb-soft) 980ms both; }

    /* ---------- Tablette / portrait : mot centré ---------- */
    @media (max-width: 1200px), (orientation: portrait) {
      .orbit-word {
        left: 0;
        width: 100%;
        text-align: center;
      }
    }

    /* ---------- Mobile : burger + feuille de menu ---------- */
    @media (max-width: 900px), (max-aspect-ratio: 4 / 5) {
      .primary-nav,
      .pill { display: none; }

      .burger {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 12;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #161616;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .burger__bars {
        position: relative;
        display: block;
        width: 18px;
        height: 12px;
      }
      .burger__bars span {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        border-radius: 2px;
        background: currentColor;
        transition: transform 360ms var(--orb-soft), opacity 200ms var(--orb-soft), top 360ms var(--orb-soft);
      }
      .burger__bars span:nth-child(1) { top: 0; }
      .burger__bars span:nth-child(2) { top: 5px; }
      .burger__bars span:nth-child(3) { top: 10px; }
      .menu-open .burger__bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }
      .menu-open .burger__bars span:nth-child(2) { opacity: 0; }
      .menu-open .burger__bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }

      .brand { top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); }
      .brand-mark { width: 40px; }

      .scrim {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: block;
        padding: 0;
        border: 0;
        background: rgba(10, 10, 10, .48);
        opacity: 0;
        visibility: hidden;
        cursor: pointer;
        transition: opacity 360ms var(--orb-soft), visibility 0s linear 360ms;
      }
      .sheet {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        right: 10px;
        z-index: 10;
        display: block;
        padding: 84px 26px 28px;
        border-radius: 26px;
        background: rgba(30, 30, 30, .62);
        border: 1px solid rgba(255, 255, 255, .12);
        -webkit-backdrop-filter: blur(22px) saturate(140%);
        backdrop-filter: blur(22px) saturate(140%);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-12px);
        transition: opacity 360ms var(--orb-soft), transform 420ms var(--orb-reveal), visibility 0s linear 420ms;
      }
      .sheet ul { margin: 0; padding: 0; list-style: none; }
      .sheet li + li { border-top: 1px solid rgba(255, 255, 255, .1); }
      .sheet a {
        display: block;
        padding: 15px 0;
        color: #fff;
        text-decoration: none;
        font-size: 26px;
        line-height: 1.1;
      }
      .sheet .sheet__pill {
        display: inline-flex;
        align-items: center;
        margin-top: 22px;
        height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        background: #fff;
        color: #161616;
        font-size: 16px;
        letter-spacing: 0.026923em;
      }
      .menu-open .scrim {
        opacity: 1;
        visibility: visible;
        transition: opacity 360ms var(--orb-soft), visibility 0s;
      }
      .menu-open .sheet {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        transition: opacity 360ms var(--orb-soft), transform 420ms var(--orb-reveal), visibility 0s;
      }

      /* Entrée mobile : délais un peu plus serrés */
      .anim .brand  { animation: orb-quiet 620ms var(--orb-soft) 80ms both; }
      .anim .burger { animation: orb-quiet 620ms var(--orb-soft) 160ms both; }
      .anim .orbit-word__inner { animation: orb-word 1100ms var(--orb-reveal) 240ms both; }
      .anim .flower { animation: orb-subject 1100ms var(--orb-reveal) 560ms both; }
      .anim .support-copy__inner { animation: orb-corner 700ms var(--orb-soft) 860ms both; }
    }

    /* ---------- Portrait étroit : fleur plus petite et centrée ---------- */
    @media (max-aspect-ratio: 4 / 5) {
      .orbit-word {
        top: 15dvh;
        font-size: min(27.5vw, 18dvh);
      }
      .flower {
        top: auto;
        bottom: 17dvh;
        left: 50vw;
        height: min(55dvh, 110vw);
      }
      .support-copy {
        width: 42vw;
        white-space: normal;
        font-size: clamp(13px, 3.6vw, 18px);
      }
      .support-copy br { display: none; }
      .support-copy--left  { left: 5vw; }
      .support-copy--right { left: auto; right: 5vw; text-align: right; transform-origin: right bottom; }
    }

    /* ---------- Mouvements réduits : simple fondu de la scène ---------- */
    @media (prefers-reduced-motion: reduce) {
      .anim .brand,
      .anim .burger,
      .anim .pill,
      .anim .primary-nav li a,
      .anim .orbit-word__inner,
      .anim .flower,
      .anim .support-copy__inner { animation: none !important; }
      .anim .stage { animation: orb-stage 280ms linear both; }
      .burger__bars span,
      .scrim,
      .sheet { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="stage" id="accueil" aria-labelledby="orbit-title">

      <a class="brand" href="#accueil" aria-label="Døds — accueil">
        <svg class="brand-mark" viewBox="0 0 66 62" aria-hidden="true" focusable="false">
          <line x1="33" y1="1" x2="33" y2="61"/>
          <line x1="3" y1="31" x2="63" y2="31"/>
          <line x1="11.8" y1="9.8" x2="54.2" y2="52.2"/>
          <line x1="54.2" y1="9.8" x2="11.8" y2="52.2"/>
        </svg>
      </a>

      <nav class="primary-nav" aria-label="Navigation principale">
        <ul>
          <li><a href="#accueil">Accueil</a></li>
          <li><a href="#figures">Les figures</a></li>
          <li><a href="#securite">Sécurité</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>

      <a class="pill" href="#contact">Saut de la mort</a>

      <h1 class="orbit-word" id="orbit-title" aria-label="Døds">
        <span class="orbit-word__mask" aria-hidden="true">
          <span class="orbit-word__inner">
            <span class="orbit-word__white"><span class="orbit-word__o">D</span>Ø</span><span class="orbit-word__pink">DS</span>
          </span>
        </span>
      </h1>

      <div class="flower">
        <img class="flower__sizer" src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&amp;w=1280&amp;q=85" alt="" aria-hidden="true" draggable="false">
        <div class="flower__layer flower__layer--bg">
          <img src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&amp;w=1280&amp;q=85" alt="Lys en pixel-art rose et violet" draggable="false">
        </div>
        <div class="flower__layer flower__layer--top" aria-hidden="true">
          <img src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&amp;w=1280&amp;q=85" alt="" draggable="false">
        </div>
      </div>

      <p class="support-copy support-copy--left">
        <span class="support-copy__inner">Tomber à plat, <br>plier au dernier moment.</span>
      </p>
      <p class="support-copy support-copy--right">
        <span class="support-copy__inner">Dix mètres de vide. <br>Une seule entrée dans l’eau.</span>
      </p>

      <!-- Menu mobile -->
      <button class="scrim" type="button" tabindex="-1" aria-label="Fermer le menu"></button>
      <div class="sheet" id="menu-sheet" role="dialog" aria-modal="true" aria-label="Menu" inert>
        <ul>
          <li><a href="#accueil">Accueil</a></li>
          <li><a href="#figures">Les figures</a></li>
          <li><a href="#securite">Sécurité</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <a class="sheet__pill" href="#contact">Saut de la mort</a>
      </div>
      <button class="burger" type="button" aria-label="Ouvrir le menu" aria-controls="menu-sheet" aria-expanded="false">
        <span class="burger__bars" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>

    </section>
  </main>

  <script>
  (function () {
    "use strict";

    var root = document.documentElement;
    var stage = document.querySelector(".stage");

    /* ---------- Fin de l'animation d'entrée (une seule fois) ---------- */
    (function () {
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        root.classList.remove("anim");
      }
      setTimeout(finish, 6000); // sécurité
      function wait() {
        if (!document.getAnimations) return;
        var list = document.getAnimations().filter(function (a) {
          return a.animationName && a.animationName.indexOf("orb-") === 0;
        });
        if (!list.length) { finish(); return; }
        Promise.all(list.map(function (a) { return a.finished; })).then(finish, finish);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { requestAnimationFrame(wait); });
      } else {
        requestAnimationFrame(wait);
      }
    })();

    /* ---------- Traînée qui se déforme sous la souris ---------- */
    var TRAIL_MAX_POINTS = 60;
    var TRAIL_HEAD_R = 140;
    var TRAIL_NOISE_AMP = 44;
    var TRAIL_BLOB_PTS = 24;
    var TRAIL_FADE_SPEED = 0.92;
    var TRAIL_SAMPLE_DIST = 8;

    var flower = document.querySelector(".flower");
    var trail = [];
    var headRadius = 0;
    var time = 0;
    var hovering = false;
    var mouse = { x: 0, y: 0, has: false };
    var lastSample = null;

    function drawMorphBlob(ctx, cx, cy, r, t, seed) {
      if (r < 2) return;
      var pts = [];
      for (var i = 0; i < TRAIL_BLOB_PTS; i++) {
        var angle = (i / TRAIL_BLOB_PTS) * Math.PI * 2;
        var n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
        var n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
        var n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
        var noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / TRAIL_HEAD_R);
        var rr = Math.max(0, r + noise);
        pts.push([cx + Math.cos(angle) * rr, cy + Math.sin(angle) * rr]);
      }
      var n = pts.length;
      var last = pts[n - 1], first = pts[0];
      ctx.beginPath();
      ctx.moveTo((last[0] + first[0]) / 2, (last[1] + first[1]) / 2);
      for (var j = 0; j < n; j++) {
        var p = pts[j], q = pts[(j + 1) % n];
        ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      }
      ctx.closePath();
      ctx.fill();
    }

    function MorphTrailLayer(layerEl, invert) {
      this.el = layerEl;
      this.invert = invert;
      this.canvas = document.createElement("canvas");
      this.canvas.className = "trail-canvas";
      this.canvas.setAttribute("aria-hidden", "true");
      this.ctx = this.canvas.getContext("2d");
      flower.appendChild(this.canvas);
    }
    MorphTrailLayer.prototype.resize = function (w, h) {
      w = Math.max(1, Math.round(w));
      h = Math.max(1, Math.round(h));
      if (this.canvas.width !== w) this.canvas.width = w;
      if (this.canvas.height !== h) this.canvas.height = h;
    };
    MorphTrailLayer.prototype.render = function (points, head) {
      var ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      if (this.invert) {
        ctx.clearRect(0, 0, w, h);
      } else {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = "destination-out";
      }
      ctx.fillStyle = "#fff";
      for (var i = 0; i < points.length; i++) {
        var pt = points[i];
        ctx.globalAlpha = pt.alpha;
        drawMorphBlob(ctx, pt.x, pt.y, pt.r, time, pt.seed);
      }
      if (head) {
        ctx.globalAlpha = 1;
        drawMorphBlob(ctx, head.x, head.y, head.r, time, 0);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      var url = "url(" + this.canvas.toDataURL() + ")";
      this.el.style.webkitMaskImage = url;
      this.el.style.maskImage = url;
    };
    MorphTrailLayer.prototype.reset = function () {
      var v = this.invert ? "linear-gradient(#0000, #0000)" : "none";
      this.el.style.webkitMaskImage = v;
      this.el.style.maskImage = v;
    };

    var layers = [
      new MorphTrailLayer(document.querySelector(".flower__layer--bg"), false),
      new MorphTrailLayer(document.querySelector(".flower__layer--top"), true)
    ];

    function toFlowerSpace(e) {
      var rect = flower.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      var c = layers[0].canvas;
      mouse.x = (e.clientX - rect.left) * (c.width / rect.width);
      mouse.y = (e.clientY - rect.top) * (c.height / rect.height);
      mouse.has = true;
    }

    stage.addEventListener("mouseenter", function (e) { hovering = true; toFlowerSpace(e); });
    stage.addEventListener("mousemove", function (e) { hovering = true; toFlowerSpace(e); });
    stage.addEventListener("mouseleave", function () { hovering = false; lastSample = null; });

    var wasActive = false;
    function frame() {
      requestAnimationFrame(frame);

      var w = flower.offsetWidth, h = flower.offsetHeight;
      if (!w || !h) return;
      for (var k = 0; k < layers.length; k++) layers[k].resize(w, h);

      var targetR = hovering ? TRAIL_HEAD_R : 0;
      headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);
      if (!hovering && headRadius < 0.5) headRadius = 0;

      if (hovering && headRadius > 5 && mouse.has) {
        var dx = lastSample ? mouse.x - lastSample.x : Infinity;
        var dy = lastSample ? mouse.y - lastSample.y : 0;
        if (Math.sqrt(dx * dx + dy * dy) > TRAIL_SAMPLE_DIST) {
          trail.push({ x: mouse.x, y: mouse.y, r: headRadius, alpha: 1, seed: Math.random() * 100 });
          if (trail.length > TRAIL_MAX_POINTS) trail.shift();
          lastSample = { x: mouse.x, y: mouse.y };
        }
      }

      for (var i = trail.length - 1; i >= 0; i--) {
        var p = trail[i];
        p.alpha *= TRAIL_FADE_SPEED;
        p.r *= 0.995;
        if (p.alpha < 0.01) trail.splice(i, 1);
      }

      time += 0.016;

      var active = trail.length > 0 || headRadius > 0;
      if (active) {
        var head = mouse.has && headRadius >= 2 ? { x: mouse.x, y: mouse.y, r: headRadius } : null;
        for (var m = 0; m < layers.length; m++) layers[m].render(trail, head);
        wasActive = true;
      } else if (wasActive) {
        for (var z = 0; z < layers.length; z++) layers[z].reset();
        wasActive = false;
      }
    }
    requestAnimationFrame(frame);

    /* ---------- Menu mobile ---------- */
    var burger = document.querySelector(".burger");
    var sheet = document.querySelector(".sheet");
    var scrim = document.querySelector(".scrim");
    var open = false;

    function setMenu(state) {
      open = state;
      root.classList.toggle("menu-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
      burger.setAttribute("aria-label", open ? "Fermer le menu" : "Ouvrir le menu");
      if (open) {
        sheet.removeAttribute("inert");
        var first = sheet.querySelector("a");
        if (first) first.focus();
      } else {
        sheet.setAttribute("inert", "");
        burger.focus();
      }
    }

    burger.addEventListener("click", function () { setMenu(!open); });
    scrim.addEventListener("click", function () { setMenu(false); });
    sheet.addEventListener("click", function (e) {
      if (e.target.closest("a")) setMenu(false);
    });

    document.addEventListener("keydown", function (e) {
      if (!open) return;
      if (e.key === "Escape") { e.preventDefault(); setMenu(false); return; }
      if (e.key === "Tab") {
        var items = [burger].concat(Array.prototype.slice.call(sheet.querySelectorAll("a")));
        var idx = items.indexOf(document.activeElement);
        e.preventDefault();
        var next = e.shiftKey ? idx - 1 : idx + 1;
        if (next < 0) next = items.length - 1;
        if (next >= items.length || idx === -1) next = e.shiftKey ? items.length - 1 : 0;
        items[next].focus();
      }
    });

    // Si l'écran repasse en mode ordinateur, on referme le menu.
    var mq = window.matchMedia("(max-width: 900px), (max-aspect-ratio: 4 / 5)");
    function onMq() { if (!mq.matches && open) setMenu(false); }
    if (mq.addEventListener) mq.addEventListener("change", onMq); else mq.addListener(onMq);
  })();
  </script>
</body>
</html>
