ojet part du terrain, des besoins exprimés par les producteurs, et se développe en lien avec des partenaires locaux, publics ou associatifs.","Ces projets prennent différentes formes : accompagnement à la labellisation, ateliers de formation, diagnostics partagés, ou encore échanges de pratiques entre salines artisanales. Ils ont tous en commun de défendre un patrimoine vivant, souvent menacé, mais porteur d’avenir."]},{type:"liste",titre:"Un accompagnement à 360°",elements:["Patrimoine culturel","Ethnologie et socio-histoire","Environnement","Tourisme de savoir-faire","Muséographie et événementiel","Valorisation économique","Création et réactivation de signes d’origine et de qualité","Organisation collective des producteurs","Cahiers des charges et plans de contrôle","Impact territorial durable","Études de marché"]},{type:"texte",paragraphes:["* Holena : « récolter le sel » en breton. Un mot-racine pour un projet ancré dans la transmission des savoirs, des gestes, le développement durable des territoires et la juste rémunération du travail des producteurs."]}]},{id:"perou",court:"Pérou",numero:"02",surtitre:"[ PÉROU — SEL DE MARAS ]",titre:"Pérou : Sel de Maras",chapo:"Salines artisanales des Andes, un patrimoine vivant.",image:{src:Wa,alt:"Chemin vers les salines de Maras, au Pérou"},blocs:[{type:"aCompleter",titre:"Le projet au Pérou",consigne:"Coller ici le texte de la sous-page « Pérou : Sel de Maras » du site piaf.solutions."}]},{id:"chili",court:"Chili",numero:"03",surtitre:"[ CHILI — ZONE DE CAHUIL ]",titre:"Chili : Zone de Cahuil",chapo:"Accueil d’une délégation de paludiers chiliens sur la presqu’île guérandaise.",image:{src:Oc,alt:"Cabane à sel au bord de la lagune de Cahuil, au Chili"},blocs:[{type:"infos",titre:"Les Ponts du Sel — Chili",lignes:[{label:"Où",valeur:"Presqu’île guérandaise"},{label:"Quand",valeur:"Du 15 au 20 juillet 2025"},{label:"Au programme",valeur:"Expositions · Projections · Rencontres"},{label:"Organisé par",valeur:"HOLENA, avec le
