        <h1>HOLENA — Les Ponts du Sel</h1>
        <p>Un collectif d’experts au service de la valorisation territoriale durable des activités économiques traditionnelles.</p>
        <p>À partir du terroir et de l’expérience privilégiée de Guérande, HOLENA intervient dans plusieurs régions du monde : au Pérou (salines de Maras) et au Chili (zone de Cahuil). Ses missions de conseil, d’expertise technique et juridique accompagnent la mise en place d’AOC et d’IGP pour les communautés locales, les écosystèmes et la chaîne de valeur.</p>
        <h2>Les Ponts du Sel</h2>
        <ul>
          <li>HOLENA Guérande : le terroir de départ, et le livre « Une autre fois dans l’Ouest », 50 années de renaissance du sel de Guérande.</li>
          <li>Pérou : Sel de Maras, salines artisanales des Andes à plus de 3 000 m, première Indication Géographique du Pérou (INDECOPI, octobre 2024).</li>
          <li>Chili : Zone de Cahuil, accueil d’une délégation de paludiers chiliens du 14 au 20 juillet 2025.</li>
          <li>Label « La Mer en Commun » : l’action « Les Ponts du Sel : Chili » reçoit le label national.</li>
        </ul>
        <h2>L’équipe</h2>
        <ul>
          <li>Charles Perraud — Expert SIQO et organisation de producteurs</li>
          <li>Nicolas Mezzalira — Expert coopération internationale et storytelling</li>
          <li>Laurent Pacoud — Expert stratégie économique et développement durable</li>
          <li>Anatole Danto — Expert patrimoine culturel immatériel</li>
          <li>Gildas Buron — Expert ethnohistoire</li>
          <li>Mikael Simonin — Experte muséographie et tourisme</li>
          <li>Thierry Merré — Expert valorisation visuelle</li>
        </ul>
        <p>Holena : « récolter le sel » en breton.</p>
